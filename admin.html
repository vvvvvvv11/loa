<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>LOA — Админ Панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- SUPABASE SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); 
            color: #e0e0e0; 
            min-height: 100vh;
            padding: 12px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .logout-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .logout-btn:hover { background: #ff6666; }

        /* ===== LOGIN PAGE ===== */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .login-card h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-card .sub {
            color: #888;
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .login-card input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .login-card input:focus {
            outline: none;
            border-color: #ffd700;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #000;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-card button:hover { background: #ffed4a; }

        .error {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success {
            background: rgba(76,175,80,0.2);
            border: 1px solid #4caf50;
            color: #88dd88;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .hidden { display: none !important; }

        /* ===== DASHBOARD ===== */
        .dashboard { display: flex; gap: 20px; flex-wrap: wrap; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #888;
            padding: 12px 16px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-size: 14px;
        }

        .tab-btn.active {
            color: #ffd700;
            border-bottom-color: #ffd700;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== CARDS ===== */
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ===== TABLES ===== */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(255,215,0,0.2);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        tr:hover { background: rgba(255,255,255,0.03); }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .status-bought { background: rgba(33,150,243,0.2); color: #64b5f6; }
        .status-shipped { background: rgba(255,152,0,0.2); color: #ffb74d; }
        .status-delivered { background: rgba(76,175,80,0.2); color: #81c784; }
        .status-cancelled { background: rgba(244,67,54,0.2); color: #ef5350; }
        .status-refund { background: rgba(156,39,176,0.2); color: #ce93d8; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-primary { background: #ffd700; color: #000; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-primary:hover { background: #ffed4a; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .btn-danger { background: #ff4444; color: #fff; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-danger:hover { background: #ff6666; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }

        .filter-btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-status-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #888;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-status-btn.active {
            background: #ffd700;
            color: #000;
            border-color: #ffd700;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #ffd700;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: 600;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #ffd700;
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            background: #ffd700;
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover { background: #ffed4a; }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-close:hover { color: #fff; }

        .order-details, .product-details {
            background: rgba(255,255,255,0.02);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .order-details div, .product-details div {
            padding: 8px 0;
            font-size: 14px;
        }

        .order-details .label, .product-details .label {
            color: #ffd700;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; }
            .header h1 { font-size: 20px; }
            table { font-size: 12px; }
            th, td { padding: 8px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <h1>LOA</h1>
            <p class="sub">Админ Панель</p>
            <div id="loginMessage"></div>
            <input 
                type="password" 
                id="passwordInput" 
                placeholder="Введите пароль"
                autocomplete="current-password"
            >
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard hidden">
        <div style="width: 100%;">
            <!-- HEADER -->
            <div class="header">
                <h1>LOA — Админ Панель</h1>
                <div class="header-right">
                    <span id="userEmail" style="font-size: 14px; color: #888;"></span>
                    <button class="logout-btn" onclick="logout()">Выход</button>
                </div>
            </div>

            <!-- STATS -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="totalOrders">0</div>
                    <div class="label">Всего заказов</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="totalProducts">0</div>
                    <div class="label">Товары</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="boughtOrders">0</div>
                    <div class="label">Выкуплено</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="deliveredOrders">0</div>
                    <div class="label">Доставлено</div>
                </div>
            </div>

            <!-- TABS -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('ordersTab')">📦 Заказы</button>
                <button class="tab-btn" onclick="switchTab('productsTab')">📚 Товары</button>
                <button class="tab-btn" onclick="switchTab('settingsTab')">⚙️ Настройки</button>
            </div>

            <!-- ORDERS TAB -->
            <div id="ordersTab" class="tab-content active">
                <div class="card">
                    <h2>Управление заказами</h2>
                    
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Поиск по ID, имени или товарам..."
                            onkeyup="filterOrders()"
                        >
                    </div>

                    <div class="filter-btn-group">
                        <button class="filter-status-btn active" onclick="filterByStatus('all')">Все</button>
                        <button class="filter-status-btn" onclick="filterByStatus('bought')">Выкуплено</button>
                        <button class="filter-status-btn" onclick="filterByStatus('shipped')">Отправлено</button>
                        <button class="filter-status-btn" onclick="filterByStatus('delivered')">Доставлено</button>
                        <button class="filter-status-btn" onclick="filterByStatus('cancelled')">Отменено</button>
                    </div>

                    <div class="table-responsive" id="ordersContainer"></div>
                </div>
            </div>

            <!-- PRODUCTS TAB -->
            <div id="productsTab" class="tab-content">
                <div class="card">
                    <h2>
                        Управление товарами
                        <button class="btn-primary btn-sm" onclick="openAddProductModal()">+ Добавить товар</button>
                    </h2>
                    <div class="table-responsive" id="productsContainer"></div>
                </div>
            </div>

            <!-- SETTINGS TAB -->
            <div id="settingsTab" class="tab-content">
                <div class="card">
                    <h2>Смена пароля</h2>
                    <div class="form-group">
                        <label class="form-label">Новый пароль</label>
                        <input 
                            type="password" 
                            id="adminPassword" 
                            class="form-input"
                            placeholder="Введите новый пароль"
                        >
                    </div>
                    <button class="btn-submit" onclick="updateAdminPassword()">Сохранить пароль</button>
                </div>

                <div class="card">
                    <h2>Интеграции</h2>
                    <div class="form-group">
                        <label class="form-label">Supabase URL</label>
                        <input 
                            type="text" 
                            id="supabaseUrl" 
                            class="form-input"
                            placeholder="https://xxx.supabase.co"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label">Supabase Ключ</label>
                        <input 
                            type="text" 
                            id="supabaseKey" 
                            class="form-input"
                            placeholder="eyJhbG..."
                        >
                    </div>
                    <button class="btn-submit" onclick="updateSupabaseSettings()">Сохранить</button>
                </div>

                <div class="card">
                    <h2>Экспорт данных</h2>
                    <button class="btn-submit" onclick="exportOrdersStats()">📊 Скачать статистику заказов</button>
                    <button class="btn-submit" onclick="exportProductsData()" style="margin-top: 10px;">📦 Скачать каталог товаров</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- STATUS MODAL -->
<div id="statusModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            Изменить статус
            <button class="modal-close" onclick="closeStatusModal()">×</button>
        </div>
        <div id="modalOrderInfo"></div>
        <div class="form-group">
            <label class="form-label">Новый статус</label>
            <select id="statusSelect" class="form-input">
                <option value="bought">✅ Выкуплено</option>
                <option value="shipped">🚚 Отправлено</option>
                <option value="delivered">🎉 Доставлено</option>
                <option value="cancelled">❌ Отменено</option>
                <option value="refund">↩️ Возврат</option>
            </select>
        </div>
        <button class="btn-submit" onclick="updateOrderStatus()" style="width: 100%;">Сохранить</button>
    </div>
</div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="productModalTitle">Добавить товар</span>
            <button class="modal-close" onclick="closeProductModal()">×</button>
        </div>
        <div class="form-group">
            <label class="form-label">Название</label>
            <input type="text" id="productName" class="form-input" placeholder="Название товара">
        </div>
        <div class="form-group">
            <label class="form-label">Описание</label>
            <textarea id="productDescription" class="form-textarea" placeholder="Описание товара"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Цена (₽)</label>
            <input type="number" id="productPrice" class="form-input" placeholder="0">
        </div>
        <div class="form-group">
            <label class="form-label">URL изображения</label>
            <input type="text" id="productImage" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
            <label class="form-label">Категория</label>
            <input type="text" id="productCategory" class="form-input" placeholder="Категория товара">
        </div>
        <button class="btn-submit" onclick="saveProduct()" style="width: 100%; margin-bottom: 10px;">💾 Сохранить</button>
        <button class="btn-secondary" onclick="closeProductModal()" style="width: 100%;">Отмена</button>
    </div>
</div>

<script src="/api/telegram.js"></script>

<script>
    // ===== SUPABASE КОНФИГУРАЦИЯ =====
    let supabase = null;
    let currentUser = null;

    // ===== STATE =====
    let orders = [];
    let products = [];
    let filteredOrders = [];
    let currentStatusFilter = 'all';
    let currentStatusOrder = null;
    let currentEditProductId = null;

    // ===== STATUS LABELS =====
    const STATUS_LABELS = {
        bought: '✅ Выкуплено',
        shipped: '🚚 Отправлено',
        delivered: '🎉 Доставлено',
        cancelled: '❌ Отменено',
        refund: '↩️ Возврат'
    };

    const STATUS_CLASSES = {
        bought: 'status-bought',
        shipped: 'status-shipped',
        delivered: 'status-delivered',
        cancelled: 'status-cancelled',
        refund: 'status-refund'
    };

    // ===== SUPABASE ИНИЦИАЛИЗАЦИЯ =====
    async function initSupabase() {
        const url = localStorage.getItem('supabaseUrl') || 'https://suvqxlqkdaajwypqzpug.supabase.co';
        const key = localStorage.getItem('supabaseKey') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';

        if (!supabase && url && key) {
            const { createClient } = window.supabase;
            supabase = createClient(url, key);
        }
    }

    // ===== LOGIN =====
    window.login = function() {
        const password = document.getElementById('passwordInput').value;
        const savedPassword = localStorage.getItem('adminPassword') || 'admin123';

        if (password === savedPassword) {
            localStorage.setItem('adminLogged', 'true');
            showDashboard();
            showSuccess('✅ Вы успешно вошли в систему');
        } else {
            showError('❌ Неверный пароль');
            document.getElementById('passwordInput').value = '';
        }
    };

    // ===== SHOW DASHBOARD =====
    window.showDashboard = async function() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        
        await initSupabase();
        await loadOrders();
        await loadProducts();
    };

    // ===== SHOW LOGIN PAGE =====
    window.showLoginPage = function() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('loginPage').classList.remove('hidden');
    };

    // ===== LOGOUT =====
    window.logout = function() {
        localStorage.removeItem('adminLogged');
        showLoginPage();
        showSuccess('✅ Вы вышли из системы');
    };

    // ===== LOAD ORDERS =====
    window.loadOrders = async function() {
        try {
            if (!supabase) {
                // Использование localStorage если Supabase не настроен
                const stored = localStorage.getItem('orders');
                orders = stored ? JSON.parse(stored) : [];
            } else {
                const { data, error } = await supabase
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                orders = data || [];
            }

            filteredOrders = [...orders];
            renderOrders();
            updateStats();
        } catch (err) {
            console.error('Error loading orders:', err);
            showError('Ошибка при загрузке заказов');
        }
    };

    // ===== LOAD PRODUCTS =====
    window.loadProducts = async function() {
        try {
            if (!supabase) {
                const stored = localStorage.getItem('products');
                products = stored ? JSON.parse(stored) : [];
            } else {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                products = data || [];
            }

            renderProducts();
            updateStats();
        } catch (err) {
            console.error('Error loading products:', err);
            showError('Ошибка при загрузке товаров');
        }
    };

    // ===== UPDATE STATS =====
    function updateStats() {
        document.getElementById('totalOrders').textContent = orders.length;
        document.getElementById('totalProducts').textContent = products.length;
        document.getElementById('boughtOrders').textContent = orders.filter(o => o.status === 'bought').length;
        document.getElementById('deliveredOrders').textContent = orders.filter(o => o.status === 'delivered').length;
    }

    // ===== RENDER ORDERS =====
    window.renderOrders = function() {
        const container = document.getElementById('ordersContainer');

        if (filteredOrders.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>Нет заказов</p>
                </div>
            `;
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Клиент</th>
                        <th>Товары</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                        <th>Дата</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
        `;

        filteredOrders.forEach(order => {
            const date = new Date(order.created_at).toLocaleDateString('ru-RU', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            const shortId = (order.id || '').slice(-6).toUpperCase();
            const statusLabel = STATUS_LABELS[order.status] || order.status;
            const statusClass = STATUS_CLASSES[order.status] || '';

            html += `
                <tr>
                    <td>#${shortId}</td>
                    <td>${order.name || '—'}</td>
                    <td>${order.items || '—'}</td>
                    <td>${order.total || '—'}</td>
                    <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                    <td>${date}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn-primary btn-sm" onclick="openStatusModal('${order.id}')">Изменить</button>
                            <button class="btn-secondary btn-sm" onclick="viewOrderDetails('${order.id}')">Подробно</button>
                        </div>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    };

    // ===== RENDER PRODUCTS =====
    window.renderProducts = function() {
        const container = document.getElementById('productsContainer');

        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📦</div>
                    <p>Нет товаров</p>
                </div>
            `;
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Категория</th>
                        <th>Цена</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
        `;

        products.forEach(product => {
            html += `
                <tr>
                    <td>${product.name || '—'}</td>
                    <td>${product.category || '—'}</td>
                    <td>${product.price || 0}₽</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn-primary btn-sm" onclick="editProduct('${product.id}')">Редактировать</button>
                            <button class="btn-danger btn-sm" onclick="deleteProduct('${product.id}')">Удалить</button>
                        </div>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    };

    // ===== FILTER ORDERS =====
    window.filterOrders = function() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        
        filteredOrders = orders.filter(order => {
            const id = (order.id || '').toLowerCase();
            const name = (order.name || '').toLowerCase();
            const items = (order.items || '').toLowerCase();
            
            const matchesSearch = id.includes(searchText) || name.includes(searchText) || items.includes(searchText);
            const matchesStatus = currentStatusFilter === 'all' || order.status === currentStatusFilter;
            
            return matchesSearch && matchesStatus;
        });

        renderOrders();
    };

    // ===== FILTER BY STATUS =====
    window.filterByStatus = function(status) {
        currentStatusFilter = status;
        
        document.querySelectorAll('.filter-status-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        filterOrders();
    };

    // ===== OPEN STATUS MODAL =====
    window.openStatusModal = function(orderId) {
        currentStatusOrder = orders.find(o => o.id === orderId);
        if (!currentStatusOrder) return;

        const shortId = (orderId || '').slice(-6).toUpperCase();
        const infoHtml = `
            <div class="order-details">
                <div><span class="label">ID:</span> #${shortId}</div>
                <div><span class="label">Клиент:</span> ${currentStatusOrder.name || '—'}</div>
                <div><span class="label">Товары:</span> ${currentStatusOrder.items || '—'}</div>
                <div><span class="label">Сумма:</span> ${currentStatusOrder.total || '—'}</div>
                <div><span class="label">Текущий статус:</span> ${STATUS_LABELS[currentStatusOrder.status] || currentStatusOrder.status}</div>
            </div>
        `;

        document.getElementById('modalOrderInfo').innerHTML = infoHtml;
        document.getElementById('statusSelect').value = currentStatusOrder.status || '';
        document.getElementById('statusModal').classList.add('active');
    };

    // ===== CLOSE STATUS MODAL =====
    window.closeStatusModal = function() {
        document.getElementById('statusModal').classList.remove('active');
        currentStatusOrder = null;
    };

    // ===== UPDATE ORDER STATUS =====
    window.updateOrderStatus = async function() {
        if (!currentStatusOrder) return;

        const newStatus = document.getElementById('statusSelect').value;
        if (!newStatus) {
            alert('Выберите статус');
            return;
        }

        try {
            if (!supabase) {
                const orderIndex = orders.findIndex(o => o.id === currentStatusOrder.id);
                if (orderIndex !== -1) {
                    orders[orderIndex].status = newStatus;
                    orders[orderIndex].status_updated_at = new Date().toISOString();
                    localStorage.setItem('orders', JSON.stringify(orders));
                }
            } else {
                const { error } = await supabase
                    .from('orders')
                    .update({
                        status: newStatus,
                        status_updated_at: new Date().toISOString()
                    })
                    .eq('id', currentStatusOrder.id);

                if (error) throw error;
            }

            // Отправляем уведомление в Telegram
            if (window.TelegramBot && window.TelegramBot.notifyStatusChange) {
                await TelegramBot.notifyStatusChange(
                    currentStatusOrder.id,
                    currentStatusOrder.status,
                    newStatus,
                    { name: currentStatusOrder.name }
                );
            }

            closeStatusModal();
            await loadOrders();
            showSuccess(`✅ Статус заказа изменен на "${STATUS_LABELS[newStatus]}"`);
        } catch (err) {
            console.error('Error updating status:', err);
            showError('Ошибка обновления статуса: ' + err.message);
        }
    };

    // ===== VIEW ORDER DETAILS =====
    window.viewOrderDetails = function(orderId) {
        const order = orders.find(o => o.id === orderId);
        if (!order) return;

        const details = `
📦 ID: ${order.id}
👤 Клиент: ${order.name || '—'}
📦 Товары: ${order.items || '—'}
💰 Сумма: ${order.total || '—'}
📅 Дата: ${new Date(order.created_at).toLocaleString('ru-RU')}
🔄 Статус: ${STATUS_LABELS[order.status] || order.status}
🚚 Доставка: ${order.pvz ? `ПВЗ: ${order.pvz}` : (order.address || '—')}
📝 Примечание: ${order.note || 'Отсутствует'}
        `;

        alert(details);
    };

    // ===== PRODUCT OPERATIONS =====
    window.openAddProductModal = function() {
        currentEditProductId = null;
        document.getElementById('productModalTitle').textContent = 'Добавить товар';
        document.getElementById('productName').value = '';
        document.getElementById('productDescription').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productImage').value = '';
        document.getElementById('productCategory').value = '';
        document.getElementById('productModal').classList.add('active');
    };

    window.editProduct = function(productId) {
        const product = products.find(p => p.id === productId);
        if (!product) return;

        currentEditProductId = productId;
        document.getElementById('productModalTitle').textContent = 'Редактировать товар';
        document.getElementById('productName').value = product.name || '';
        document.getElementById('productDescription').value = product.description || '';
        document.getElementById('productPrice').value = product.price || '';
        document.getElementById('productImage').value = product.image || '';
        document.getElementById('productCategory').value = product.category || '';
        document.getElementById('productModal').classList.add('active');
    };

    window.closeProductModal = function() {
        document.getElementById('productModal').classList.remove('active');
        currentEditProductId = null;
    };

    window.saveProduct = async function() {
        const name = document.getElementById('productName').value.trim();
        const description = document.getElementById('productDescription').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        const image = document.getElementById('productImage').value.trim();
        const category = document.getElementById('productCategory').value.trim();

        if (!name || !price) {
            alert('Заполните название и цену');
            return;
        }

        try {
            const productData = {
                name,
                description,
                price,
                image,
                category,
                updated_at: new Date().toISOString()
            };

            if (!currentEditProductId) {
                // Добавить новый товар
                productData.created_at = new Date().toISOString();
                productData.id = 'prod_' + Date.now();

                if (!supabase) {
                    products.push(productData);
                    localStorage.setItem('products', JSON.stringify(products));
                } else {
                    const { error } = await supabase
                        .from('products')
                        .insert([productData]);
                    if (error) throw error;
                }
            } else {
                // Обновить существующий товар
                if (!supabase) {
                    const index = products.findIndex(p => p.id === currentEditProductId);
                    if (index !== -1) {
                        products[index] = { ...products[index], ...productData };
                        localStorage.setItem('products', JSON.stringify(products));
                    }
                } else {
                    const { error } = await supabase
                        .from('products')
                        .update(productData)
                        .eq('id', currentEditProductId);
                    if (error) throw error;
                }
            }

            closeProductModal();
            await loadProducts();
            showSuccess('✅ Товар сохранен');
        } catch (err) {
            console.error('Error saving product:', err);
            showError('Ошибка при сохранении товара: ' + err.message);
        }
    };

    window.deleteProduct = async function(productId) {
        if (!confirm('Вы уверены?')) return;

        try {
            if (!supabase) {
                products = products.filter(p => p.id !== productId);
                localStorage.setItem('products', JSON.stringify(products));
            } else {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', productId);
                if (error) throw error;
            }

            await loadProducts();
            showSuccess('✅ Товар удален');
        } catch (err) {
            console.error('Error deleting product:', err);
            showError('Ошибка при удалении товара');
        }
    };

    // ===== SWITCH TAB =====
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-content').forEach(el => {
            el.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(el => {
            el.classList.remove('active');
        });

        document.getElementById(tab).classList.add('active');
        event.target.classList.add('active');
    };

    // ===== UPDATE ADMIN PASSWORD =====
    window.updateAdminPassword = function() {
        const newPassword = document.getElementById('adminPassword').value;
        if (!newPassword) {
            alert('Введите новый пароль');
            return;
        }

        localStorage.setItem('adminPassword', newPassword);
        document.getElementById('adminPassword').value = '';
        showSuccess('✅ Пароль изменен');
    };

    // ===== UPDATE SUPABASE SETTINGS =====
    window.updateSupabaseSettings = function() {
        const url = document.getElementById('supabaseUrl').value.trim();
        const key = document.getElementById('supabaseKey').value.trim();

        if (!url || !key) {
            alert('Заполните все поля');
            return;
        }

        localStorage.setItem('supabaseUrl', url);
        localStorage.setItem('supabaseKey', key);
        supabase = null; // Reset
        initSupabase();
        showSuccess('✅ Настройки Supabase сохранены');
    };

    // ===== EXPORT DATA =====
    window.exportOrdersStats = function() {
        const stats = {
            totalOrders: orders.length,
            byStatus: {
                bought: orders.filter(o => o.status === 'bought').length,
                shipped: orders.filter(o => o.status === 'shipped').length,
                delivered: orders.filter(o => o.status === 'delivered').length,
                cancelled: orders.filter(o => o.status === 'cancelled').length,
                refund: orders.filter(o => o.status === 'refund').length
            },
            orders: orders,
            generatedAt: new Date().toISOString()
        };

        downloadJSON(stats, `loa-orders-${Date.now()}.json`);
        showSuccess('📊 Заказы экспортированы');
    };

    window.exportProductsData = function() {
        downloadJSON(products, `loa-products-${Date.now()}.json`);
        showSuccess('📦 Товары экспортированы');
    };

    function downloadJSON(data, filename) {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ===== HELPERS =====
    function showError(msg) {
        const div = document.createElement('div');
        div.className = 'error';
        div.textContent = msg;
        const container = document.querySelector('.container');
        container.insertBefore(div, container.firstChild);
        setTimeout(() => div.remove(), 3000);
    }

    function showSuccess(msg) {
        const div = document.createElement('div');
        div.className = 'success';
        div.textContent = msg;
        const container = document.querySelector('.container');
        container.insertBefore(div, container.firstChild);
        setTimeout(() => div.remove(), 3000);
    }

    // ===== INIT =====
    if (localStorage.getItem('adminLogged') === 'true') {
        showDashboard();
    }

    // Keyboard shortcuts
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && document.getElementById('passwordInput').offsetParent !== null) {
            login();
        }
    });
</script>

</body>
</html>
