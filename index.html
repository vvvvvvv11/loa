<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Loa — Lost of All</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Unbounded', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        .fade-up { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .product-card:nth-child(1) { transition-delay: 0.05s; }
        .product-card:nth-child(2) { transition-delay: 0.1s; }
        .product-card:nth-child(3) { transition-delay: 0.15s; }
        .product-card:nth-child(4) { transition-delay: 0.2s; }

        .nav { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .nav-hamburger { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
        .nav-hamburger span { display: block; width: 20px; height: 1.5px; background: #000; }
        .nav-logo { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 800; color: #000; letter-spacing: 1px; }
        .nav-right { display: flex; align-items: center; gap: 2px; }
        .nav-btn { background: none; border: none; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #000; border-radius: 50%; transition: background 0.15s; position: relative; }
        .nav-btn:active { background: #f0f0f0; transform: scale(0.96); }
        .nav-btn svg { width: 20px; height: 20px; stroke: #000; fill: none; stroke-width: 1.5; }
        .nav-badge { position: absolute; top: 2px; right: 2px; background: #ff2d55; color: #fff; font-size: 9px; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .nav-badge.hidden { display: none; }

        .hero { height: 100vh; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 1.2s ease; }
        .hero-bg-1 { background-image: url('https://thb.tildacdn.com/tild6165-3164-4366-b736-643835303761/-/resize/1200x/__.jpg'); opacity: 1; }
        .hero::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 1; }
        .hero-content { position: relative; z-index: 2; padding: 0 16px; }
        .hero-title { font-size: clamp(60px, 15vw, 160px); font-weight: 900; line-height: 1; letter-spacing: -2px; }
        .hero-sub { font-size: clamp(10px, 3vw, 18px); font-weight: 400; letter-spacing: 3px; margin-top: 16px; opacity: 0.9; text-transform: uppercase; }

        .wings-section { min-height: 100vh; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; background: #000; padding: 80px 20px; }
        .wings-bg { position: absolute; inset: 0; background: url('https://static.tildacdn.com/tild6362-3038-4835-b031-313564643538/photo.jpg') center/cover; opacity: 0.45; }
        .wings-content { position: relative; z-index: 2; max-width: 600px; margin: 0 auto; }
        .wings-title { font-size: clamp(36px, 8vw, 110px); font-weight: 900; line-height: 1.1; letter-spacing: -1px; text-transform: uppercase; }
        .wings-desc { font-size: clamp(13px, 4vw, 18px); max-width: 90%; margin: 28px auto 0; line-height: 1.6; opacity: 0.85; }

        .catalog { background: #fff; color: #000; padding: 60px 16px 80px; }
        .catalog-title { font-size: clamp(24px, 6vw, 32px); font-weight: 800; text-align: center; margin-bottom: 40px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
        .product-card { cursor: pointer; position: relative; transition: transform 0.3s ease; }
        .product-img-wrap { overflow: hidden; border-radius: 12px; position: relative; background: #f5f5f5; aspect-ratio: 1 / 1; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .wish-btn { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; background: rgba(255,255,255,0.95); border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
        .wish-btn svg { width: 18px; height: 18px; stroke: #000; fill: none; stroke-width: 1.8; }
        .wish-btn.liked svg { fill: #ff2d55; stroke: #ff2d55; }
        .product-name { font-size: 15px; font-weight: 700; margin-top: 12px; text-align: center; }
        .product-price { font-size: 14px; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .marquee-wrap { background: #000; color: #fff; padding: 14px 0; overflow: hidden; white-space: nowrap; width: 100%; border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; }
        .marquee-inner { display: inline-block; animation: marquee 12s linear infinite; font-size: 13px; letter-spacing: 3px; font-weight: 500; text-transform: uppercase; padding-right: 20px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .gallery { position: relative; height: 70vh; min-height: 500px; overflow: hidden; }
        .gallery-slides { display: flex; height: 100%; transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        .gallery-slide { min-width: 100%; height: 100%; background-size: cover; background-position: center; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; }
        .gallery-slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(0,0,0,0.78) 100%); z-index: 0; }
        .gallery-slide-content { position: relative; z-index: 5; text-align: center; width: 100%; pointer-events: all; }
        .gallery-slide-price { font-size: 15px; color: rgba(255,255,255,0.75); font-weight: 500; margin-bottom: 20px; }
        .gallery-arrows { position: absolute; top: 50%; transform: translateY(-50%); width: 100%; display: flex; justify-content: space-between; padding: 0 14px; z-index: 10; pointer-events: none; box-sizing: border-box; }
        .gallery-arrow { pointer-events: all; background: rgba(255,255,255,0.12); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .gallery-arrow:hover { background: rgba(255,255,255,0.25); }
        .gallery-slide-name { font-size: clamp(24px, 5vw, 38px); font-weight: 800; margin-bottom: 6px; text-align: center; color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,0.5); }
        .gallery-cart-btn { display: inline-block; background: #fff; color: #000; border: none; border-radius: 50px; padding: 14px 44px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Unbounded', sans-serif; box-shadow: 0 4px 24px rgba(0,0,0,0.35); transition: transform 0.15s, box-shadow 0.15s; position: relative; z-index: 5; }
        .gallery-cart-btn:hover { transform: scale(1.05); box-shadow: 0 8px 32px rgba(0,0,0,0.45); }
        .gallery-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
        .gallery-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
        .gallery-dot.active { width: 20px; border-radius: 4px; background: #fff; }

        .product-page { position: fixed; inset: 0; z-index: 4000; display: none; align-items: flex-start; justify-content: center; padding: 50px 16px 20px; overflow-y: auto; }
        .product-page.open { display: flex; }
        .product-page-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: -1; }
        .pp-card { background: #fff; color: #000; border-radius: 20px; width: 100%; max-width: 500px; overflow: hidden; animation: fadeUp 0.35s ease; margin: auto; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
        .pp-photo-area { position: relative; background: #111; }
        .pp-main-photo { width: 100%; max-height: 350px; object-fit: cover; display: block; }
        .pp-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        .pp-thumbs { display: flex; gap: 8px; padding: 12px; background: #fff; overflow-x: auto; }
        .pp-thumb { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
        .pp-thumb.active { border-color: #000; }
        .pp-info { padding: 20px; }
        .pp-add-btn { flex: 1; background: #000; color: #fff; border: none; border-radius: 40px; padding: 14px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Unbounded'; }
        .pp-wish-btn { width: 50px; height: 50px; border: 1px solid #ddd; border-radius: 50%; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .pp-wish-btn.liked svg { fill: #ff2d55; stroke: #ff2d55; }

        .cart-sidebar, .wish-sidebar { position: fixed; top: 0; right: -100%; width: 100%; max-width: 460px; height: 100vh; background: #fff; color: #000; box-shadow: -5px 0 25px rgba(0,0,0,0.2); transition: right 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1); z-index: 3000; display: flex; flex-direction: column; }
        .cart-sidebar.open, .wish-sidebar.open { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .cart-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
        .cart-item { padding: 14px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .cart-footer { padding: 18px 20px 25px; border-top: 1px solid #eee; }
        .cart-checkout-btn { width: 100%; background: #000; color: #fff; border: none; border-radius: 40px; padding: 15px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        
        .checkout-modal { position: fixed; inset: 0; z-index: 5000; display: none; align-items: flex-end; justify-content: center; }
        .checkout-modal.open { display: flex; }
        .checkout-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: -1; }
        .checkout-panel { background: #fff; color: #000; width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; overflow-y: auto; }
        .checkout-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; position: sticky; top: 0; background: #fff; z-index: 10; }
        .checkout-form { padding: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; display: block; }
        .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-input:focus { outline: none; border-color: #000; }
        .pvz-section { background: #f5f5f5; padding: 16px; border-radius: 8px; margin: 16px 0; }
        .pvz-section-title { font-weight: 700; margin-bottom: 12px; }
        #pvz-list { max-height: 250px; overflow-y: auto; }
        .submit-btn { width: 100%; background: #000; color: #fff; border: none; border-radius: 40px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px; }
        .submit-btn:hover { background: #333; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: #000; color: #fff; padding: 16px 24px; border-radius: 8px; z-index: 6000; max-width: 300px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .menu-sidebar { position: fixed; top: 0; left: -100%; width: 100%; max-width: 300px; height: 100vh; background: #fff; z-index: 2999; transition: left 0.35s ease; }
        .menu-sidebar.open { left: 0; }
        .menu-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 24px; cursor: pointer; }
        .menu-list { padding: 60px 20px 20px; }
        .menu-list a { display: block; padding: 12px 0; text-decoration: none; color: #000; font-weight: 600; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- NAVIGATION -->
<div class="nav">
    <button class="nav-hamburger" onclick="openMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="nav-logo">LOA</div>
    <div class="nav-right">
        <button class="nav-btn" onclick="openWish()">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <span class="nav-badge" id="wishBadge"></span>
        </button>
        <button class="nav-btn" onclick="openCart()">
            <svg viewBox="0 0 24 24"><path d="M9 2L6.5 6H2v2h19V6h-4.5L15 2H9M7 9h10l-1 10H8L7 9Z"></path></svg>
            <span class="nav-badge" id="cartBadge"></span>
        </button>
    </div>
</div>

<!-- MENU SIDEBAR -->
<div class="menu-sidebar" id="menuSidebar">
    <button class="menu-close" onclick="closeMenu()">×</button>
    <div class="menu-list">
        <a href="#hero" onclick="closeMenu()">🏠 Главная</a>
        <a href="#wings" onclick="closeMenu()">👑 О сиене</a>
        <a href="#catalog" onclick="closeMenu()">📦 Каталог</a>
        <a href="#gallery" onclick="closeMenu()">🖼️ Галерея</a>
        <a href="admin-panel.html" target="_blank">⚙️ Админ</a>
    </div>
</div>

<!-- HERO SECTION -->
<section class="hero fade-up" id="hero">
    <div class="hero-bg hero-bg-1"></div>
    <div class="hero-content">
        <h1 class="hero-title">LOA</h1>
        <p class="hero-sub">Lost of All</p>
    </div>
</section>

<!-- WINGS SECTION -->
<section class="wings-section fade-up" id="wings">
    <div class="wings-bg"></div>
    <div class="wings-content">
        <h2 class="wings-title">WINGS</h2>
        <p class="wings-desc">Откройте мир эксклюзивных товаров и уникальных находок</p>
    </div>
</section>

<!-- MARQUEE -->
<div class="marquee-wrap">
    <div class="marquee-inner" id="marqueeText">Loading...</div>
</div>

<!-- CATALOG -->
<section class="catalog fade-up" id="catalog">
    <h2 class="catalog-title">Каталог</h2>
    <div class="product-grid" id="productGrid">
        <div style="text-align: center; color: #999;">Loading products...</div>
    </div>
</section>

<section class="gallery fade-up" id="gallery">

        <div class="gallery-slide" style="background-image: url('https://thb.tildacdn.com/tild6165-3164-4366-b736-643835303761/-/resize/1200x/__.jpg');">

<!-- PRODUCT PAGE MODAL -->
<div class="product-page" id="productPage">

            <button class="pp-arrow" style="right: 12px;" onclick="nextPhoto()">›</button>
        </div>
        <div class="pp-thumbs" id="ppThumbs"></div>
        <div class="pp-info">
            <h2 id="ppName" style="font-size: 18px; margin-bottom: 8px;"></h2>
            <p id="ppPrice" style="color: #888; margin-bottom: 16px;"></p>
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <button class="pp-add-btn" onclick="addToCart()">Добавить в корзину</button>
                <button class="pp-wish-btn" id="ppWishBtn" onclick="addToWish()">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </button>
            </div>
            <button style="width: 100%; padding: 12px; background: #f5f5f5; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;" onclick="closeProductPage()">Закрыть</button>
        </div>
    </div>
</div>

<!-- CART SIDEBAR -->
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        Корзина
        <button style="background: none; border: none; font-size: 24px; cursor: pointer;" onclick="closeCart()">×</button>
    </div>
    <div class="cart-body" id="cartBody">
        <div style="text-align: center; color: #999;">Корзина пуста</div>
    </div>
    <div class="cart-footer">
        <div style="font-size: 16px; font-weight: 700; margin-bottom: 12px;">Итого: <span id="cartTotal">₽0</span></div>
        <button class="cart-checkout-btn" onclick="openCheckout()">Оформить заказ</button>
    </div>
</div>

<!-- WISH SIDEBAR -->
<div class="wish-sidebar" id="wishSidebar">
    <div class="cart-header">
        Избранное
        <button style="background: none; border: none; font-size: 24px; cursor: pointer;" onclick="closeWish()">×</button>
    </div>
    <div class="cart-body" id="wishBody">
        <div style="text-align: center; color: #999;">Нет избранных товаров</div>
    </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="checkout-modal" id="checkoutModal">
    <div class="checkout-panel">
        <div class="checkout-header">
            Оформление заказа
            <button style="background: none; border: none; font-size: 24px; cursor: pointer;" onclick="closeCheckout()">×</button>
        </div>
        <div class="checkout-form">
            <div class="form-group">
                <label class="form-label">Имя</label>
                <input type="text" class="form-input" id="checkoutName" placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <label class="form-label">Номер телефона</label>
                <input type="tel" class="form-input" id="checkoutPhone" placeholder="+7 (999) 999-99-99">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="checkoutEmail" placeholder="your@email.com">
            </div>

            <div class="pvz-section">
                <div class="pvz-section-title">📍 Пункт выдачи</div>
                <input type="text" class="form-input" id="cityInput" placeholder="Введите город (например, Москва)">
                <button style="width: 100%; background: #f5f5f5; border: 1px solid #ddd; padding: 12px; border-radius: 8px; cursor: pointer; margin-top: 8px;" id="searchBtn">Найти пункты</button>
                <div id="pvz-list" style="margin-top: 12px;"></div>
                <div id="selectedPvzBlock" style="margin-top: 12px; padding: 12px; background: #e8f5e9; border-radius: 8px; display: none;">
                    <div style="font-weight: 600; margin-bottom: 4px;">Выбран:</div>
                    <div id="selectedPvzText" style="font-size: 13px;"></div>
                </div>
            </div>

            <div id="checkoutItems" style="background: #f5f5f5; padding: 16px; border-radius: 8px; margin: 16px 0;"></div>

            <button class="submit-btn" onclick="submitOrder()">Заказать</button>
        </div>
    </div>
</div>

    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZid2J3cnFlcGRqaWxpaWFiZWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTA1NjMsImV4cCI6MjA5NDMyNjU2M30.a4RaEbcicNA0moct5bSjEeLNbsumbp8jDno4bkuWlJA';

    let supabase;
    import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/module/index.js').then(({ createClient }) => {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    });

    // DATA
    let products = [];
    let cart = [];
    let wish = [];
    let currentProductIndex = 0;
    let currentPhotoIndex = 0;
    let currentProduct = null;
    let selectedPvzObj = null;

    // MENU
    function openMenu() { document.getElementById('menuSidebar').classList.add('open'); }
    function closeMenu() { document.getElementById('menuSidebar').classList.remove('open'); }

    // CART
    function openCart() { document.getElementById('cartSidebar').classList.add('open'); }
    function closeCart() { document.getElementById('cartSidebar').classList.remove('open'); }

    // WISH
    function openWish() { document.getElementById('wishSidebar').classList.add('open'); }
    function closeWish() { document.getElementById('wishSidebar').classList.remove('open'); }

    // CHECKOUT
    function openCheckout() {
        if (cart.length === 0) {
            showToast('⚠️ Корзина пуста');
            return;
        }
        document.getElementById('checkoutModal').classList.add('open');
        renderCheckoutItems();
    }

    function closeCheckout() {
        document.getElementById('checkoutModal').classList.remove('open');
    }

    function renderCheckoutItems() {
        const container = document.getElementById('checkoutItems');
        let html = '<div style="font-weight: 600; margin-bottom: 12px;">Товары в заказе:</div>';
        cart.forEach(item => {
            html += `<div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
                <span>${item.name}</span>
                <span>₽${item.price}</span>
            </div>`;
        });
        const total = cart.reduce((sum, item) => sum + parseInt(item.price), 0);
        html += `<div style="border-top: 1px solid #ddd; margin-top: 12px; padding-top: 12px; font-weight: 700; display: flex; justify-content: space-between;">
            <span>Итого:</span>
            <span>₽${total}</span>
        </div>`;
        container.innerHTML = html;
    }

    function addToCart() {
        if (!currentProduct) return;
        cart.push({ ...currentProduct });
        updateCartBadge();
        closeProductPage();
        showToast('✅ Добавлено в корзину');
        renderCart();
    }

    function addToWish() {
        if (!currentProduct) return;
        const exists = wish.find(w => w.id === currentProduct.id);
        if (!exists) {
            wish.push({ ...currentProduct });
        } else {
            wish = wish.filter(w => w.id !== currentProduct.id);
        }
        updateWishBadge();
        updateWishButton();
        renderWish();
        showToast(exists ? '❤️ Удалено из избранного' : '❤️ Добавлено в избранное');
    }

    function renderCart() {
        const body = document.getElementById('cartBody');
        if (cart.length === 0) {
            body.innerHTML = '<div style="text-align: center; color: #999;">Корзина пуста</div>';
            document.getElementById('cartTotal').textContent = '₽0';
            return;
        }

        let html = '';
        cart.forEach((item, i) => {
            html += `<div class="cart-item">
                <div>
                    <div style="font-weight: 600; font-size: 14px;">${item.name}</div>
                    <div style="color: #888; font-size: 12px;">₽${item.price}</div>
                </div>
                <button style="background: none; border: none; color: #ff2d55; cursor: pointer; font-size: 18px;" onclick="removeFromCart(${i})">×</button>
            </div>`;
        });
        body.innerHTML = html;

        const total = cart.reduce((sum, item) => sum + parseInt(item.price), 0);
        document.getElementById('cartTotal').textContent = '₽' + total;
    }

    function renderWish() {
        const body = document.getElementById('wishBody');
        if (wish.length === 0) {
            body.innerHTML = '<div style="text-align: center; color: #999;">Нет избранных товаров</div>';
            return;
        }

        let html = '';
        wish.forEach((item, i) => {
            html += `<div class="cart-item">
                <div>
                    <div style="font-weight: 600; font-size: 14px;">${item.name}</div>
                    <div style="color: #888; font-size: 12px;">₽${item.price}</div>
                </div>
                <button style="background: none; border: none; color: #ff2d55; cursor: pointer; font-size: 18px;" onclick="removeFromWish(${i})">×</button>
            </div>`;
        });
        body.innerHTML = html;
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartBadge();
        renderCart();
        showToast('🗑️ Удалено из корзины');
    }

    function removeFromWish(index) {
        wish.splice(index, 1);
        updateWishBadge();
        renderWish();
        showToast('💔 Удалено из избранного');
    }

    function updateCartBadge() {
        const badge = document.getElementById('cartBadge');
        if (cart.length > 0) {
            badge.textContent = cart.length;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function updateWishBadge() {
        const badge = document.getElementById('wishBadge');
        if (wish.length > 0) {
            badge.textContent = wish.length;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function updateWishButton() {
        const btn = document.getElementById('ppWishBtn');
        if (currentProduct && wish.find(w => w.id === currentProduct.id)) {
            btn.classList.add('liked');
        } else {
            btn.classList.remove('liked');
        }
    }

    // PRODUCT PAGE
    function openProductPage(product) {
        currentProduct = product;
        currentPhotoIndex = 0;
        document.getElementById('productPage').classList.add('open');
        updateProductPageContent();
    }

    function closeProductPage() {
        document.getElementById('productPage').classList.remove('open');
    }

    function updateProductPageContent() {
        if (!currentProduct) return;

        const photos = currentProduct.photos || [currentProduct.image];
        document.getElementById('ppMainPhoto').src = photos[currentPhotoIndex];
        document.getElementById('ppName').textContent = currentProduct.name;
        document.getElementById('ppPrice').textContent = `₽${currentProduct.price}`;

        const thumbsContainer = document.getElementById('ppThumbs');
        thumbsContainer.innerHTML = '';
        photos.forEach((photo, i) => {
            const thumb = document.createElement('img');
            thumb.className = 'pp-thumb' + (i === currentPhotoIndex ? ' active' : '');
            thumb.src = photo;
            thumb.onclick = () => {
                currentPhotoIndex = i;
                updateProductPageContent();
            };
            thumbsContainer.appendChild(thumb);
        });

        updateWishButton();
    }

    function nextPhoto() {
        const photos = currentProduct.photos || [currentProduct.image];
        currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
        updateProductPageContent();
    }

    function prevPhoto() {
        const photos = currentProduct.photos || [currentProduct.image];
        currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
        updateProductPageContent();
    }

    // GALLERY
    function renderGallery() {
        if (products.length === 0) return;

        const container = document.getElementById('gallerySLides');
        container.innerHTML = '';
        products.slice(0, 6).forEach((product, i) => {
            const slide = document.createElement('div');
            slide.className = 'gallery-slide';
            slide.style.backgroundImage = `url('${product.image}')`;
            slide.innerHTML = `
                <div class="gallery-slide-content">
                    <h3 class="gallery-slide-name">${product.name}</h3>
                    <p class="gallery-slide-price">₽${product.price}</p>
                    <button class="gallery-cart-btn" onclick="openProductPage(window.products[${i}])">В корзину</button>
                </div>
            `;
            container.appendChild(slide);
        });

        const dotsContainer = document.getElementById('galleryDots');
        dotsContainer.innerHTML = '';
        products.slice(0, 6).forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'gallery-dot' + (i === 0 ? ' active' : '');
            dot.onclick = () => goToSlide(i);
            dotsContainer.appendChild(dot);
        });

        window.products = products;
    }

    function goToSlide(index) {
        currentProductIndex = index;
        const container = document.getElementById('gallerySLides');
        container.style.transform = `translateX(-${index * 100}%)`;
        updateGalleryDots();
    }

    function nextSlide() {
        currentProductIndex = (currentProductIndex + 1) % Math.min(products.length, 6);
        goToSlide(currentProductIndex);
    }

    function prevSlide() {
        currentProductIndex = (currentProductIndex - 1 + Math.min(products.length, 6)) % Math.min(products.length, 6);
        goToSlide(currentProductIndex);
    }

    function updateGalleryDots() {
        document.querySelectorAll('.gallery-dot').forEach((dot, i) => {
            dot.classList.toggle('active', i === currentProductIndex);
        });
    }

    // PRODUCTS
    async function loadProducts() {
        try {
            const { data, error } = await supabase
                .from('products')
                .select('*');

            if (error) throw error;

            products = data || [];
            renderProducts();
            renderGallery();
            updateMarquee();
        } catch (err) {
            console.error('Error loading products:', err);
            document.getElementById('productGrid').innerHTML = '<div style="color: #ff6666;">Ошибка загрузки товаров</div>';
        }
    }

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card fade-up visible';
            card.innerHTML = `
                <div class="product-img-wrap">
                    <img class="product-img" src="${product.image}" alt="${product.name}">
                    <button class="wish-btn" onclick="toggleWish(event, '${product.id}', '${product.name}', '${product.price}', '${product.image}')">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                </div>
                <div class="product-name">${product.name}</div>
                <div class="product-price">₽${product.price}</div>
            `;
            card.onclick = () => openProductPage(product);
            grid.appendChild(card);
        });
    }

    function toggleWish(e, id, name, price, image) {
        e.stopPropagation();
        const product = { id, name, price, image };
        const exists = wish.find(w => w.id === id);

        if (exists) {
            wish = wish.filter(w => w.id !== id);
        } else {
            wish.push(product);
        }

        updateWishBadge();
        renderWish();
        showToast(exists ? '💔 Удалено из избранного' : '❤️ Добавлено в избранное');
    }

    function updateMarquee() {
        const marquee = document.getElementById('marqueeText');
        const text = products.map(p => p.name).join(' • ');
        marquee.textContent = text || 'Загрузка товаров...';
        marquee.innerHTML = marquee.textContent + ' • ' + marquee.textContent;
    }

    // CHECKOUT/ORDER
    async function submitOrder() {
        if (cart.length === 0) {
            showToast('⚠️ Корзина пуста');
            return;
        }

        const name = document.getElementById('checkoutName').value.trim();
        const phone = document.getElementById('checkoutPhone').value.trim();
        const email = document.getElementById('checkoutEmail').value.trim();

        if (!name || !phone || !email) {
            showToast('⚠️ Заполните все поля');
            return;
        }

        if (!selectedPvzObj) {
            showToast('⚠️ Выберите пункт выдачи');
            return;
        }

        const itemsText = cart.map(item => `${item.name} (₽${item.price})`).join(', ');
        const totalPrice = cart.reduce((sum, item) => sum + parseInt(item.price), 0);
        const pvzAddress = selectedPvzObj.address || selectedPvzObj;

        try {
            const { data, error } = await supabase.from('orders').insert([{
                name: name,
                items: itemsText,
                total: `₽${totalPrice}`,
                status: 'bought',
                customer_phone: phone,
                customer_email: email,
                note: `Пункт выдачи: ${pvzAddress}`
            }]);

            if (error) throw error;

            showToast('✅ Заказ создан! Спасибо!');
            cart = [];
            updateCartBadge();
            renderCart();
            closeCheckout();
            resetCheckoutForm();

            // Send Telegram notification
            sendTelegramNotification(name, itemsText, totalPrice, phone);
        } catch (err) {
            console.error('Error creating order:', err);
            showToast('❌ Ошибка при создании заказа');
        }
    }

    function resetCheckoutForm() {
        document.getElementById('checkoutName').value = '';
        document.getElementById('checkoutPhone').value = '';
        document.getElementById('checkoutEmail').value = '';
        document.getElementById('cityInput').value = '';
        document.getElementById('pvz-list').innerHTML = '';
        selectedPvzObj = null;
    }

    async function sendTelegramNotification(name, items, total, phone) {
        try {
            // This would call your telegram webhook
            // For now, just log it
            console.log('Telegram notification would be sent to admins');
        } catch (err) {
            console.error('Telegram error:', err);
        }
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // PVZ PICKER
    let pvzData = null;

    async function loadPvzData() {
        try {
            const response = await fetch('/public/pvz.json');
            pvzData = await response.json();
        } catch (err) {
            console.error('Error loading PVZ data:', err);
        }
    }

    async function searchPvz(cityName) {
        if (!pvzData) await loadPvzData();

        const list = document.getElementById('pvz-list');
        const status = document.createElement('div');
        status.id = 'pvz-status';
        status.style.cssText = 'color: #666; font-size: 12px; margin-bottom: 12px;';

        if (!cityName.trim()) {
            status.textContent = '⚠️ Введите название города';
            list.innerHTML = '';
            return;
        }

        status.textContent = '🔍 Поиск...';
        list.innerHTML = '';
        list.parentElement.insertBefore(status, list);

        const foundCity = Object.keys(pvzData || {}).find(key =>
            key.toLowerCase() === cityName.trim().toLowerCase()
        );

        if (!foundCity) {
            status.textContent = `❌ Пункты выдачи для «${cityName}» не найдены`;
            return;
        }

        const pvzArray = (pvzData[foundCity] || []).slice(0, 10);
        status.textContent = `✅ Найдено ${pvzArray.length} пунктов выдачи`;

        pvzArray.forEach(pvz => {
            const item = document.createElement('div');
            item.style.cssText = 'padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; border-radius: 4px; transition: background 0.15s;';
            item.innerHTML = `
                <div style="font-weight: 600; font-size: 13px;">${pvz.address || pvz}</div>
                ${pvz.hours ? `<div style="font-size: 12px; color: #666; margin-top: 4px;">🕐 ${pvz.hours}</div>` : ''}
            `;
            item.onmouseover = () => item.style.background = '#f5f5f5';
            item.onmouseout = () => item.style.background = '';
            item.onclick = () => {
                selectedPvzObj = pvz;
                const block = document.getElementById('selectedPvzBlock');
                document.getElementById('selectedPvzText').textContent = pvz.address || pvz;
                block.style.display = 'block';
                showToast('✅ Пункт выбран');
            };
            list.appendChild(item);
        });
    }

    // ANIMATION
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -100px 0px'
    };

    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, observerOptions);

    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

    // INIT
    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();
        loadPvzData();

        document.getElementById('searchBtn').addEventListener('click', () => {
            const city = document.getElementById('cityInput').value;
            searchPvz(city);
        });

        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchPvz(e.target.value);
            }
        });
    });

    // Allow access to functions from console
    window.submitOrder = submitOrder;
</script>

</body>
</html>
